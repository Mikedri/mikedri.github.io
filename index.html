<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6A2B">
<title>Inglês de Bolso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: app de bolso em coluna única (máx. 520px), barra superior fixa com ofensiva/XP, abas embaixo; um disco de vinil girando é o elemento-assinatura do karaokê. */
:root{
  --bg:#EEF4F1; --surface:#FFFFFF; --surface2:#E3ECE8; --ink:#16213A; --muted:#58657D; --line:#D3DFDA;
  --accent:#FF6A2B; --accent-ink:#FFFFFF; --blue:#3157FF; --good:#14965A; --good-bg:#DDF5E8; --bad:#D93A40; --bad-bg:#FCE3E3; --gold:#E9A800;
  --disc:#1A1D26; --shadow:0 4px 0 rgba(22,33,58,.12);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#18223A; --surface2:#212D48; --ink:#EEF2FA; --muted:#9BA7C3; --line:#2B3858;
  --accent:#FF8350; --accent-ink:#1A0E07; --blue:#7C95FF; --good:#3DD68C; --good-bg:#123A2A; --bad:#FF6B70; --bad-bg:#3E1A20; --gold:#FFC93D;
  --disc:#05070C; --shadow:0 4px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#18223A; --surface2:#212D48; --ink:#EEF2FA; --muted:#9BA7C3; --line:#2B3858;
  --accent:#FF8350; --accent-ink:#1A0E07; --blue:#7C95FF; --good:#3DD68C; --good-bg:#123A2A; --bad:#FF6B70; --bad-bg:#3E1A20; --gold:#FFC93D;
  --disc:#05070C; --shadow:0 4px 0 rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.shell{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.brand .eq{display:inline-flex;gap:2px;align-items:flex-end;height:18px}
.brand .eq i{width:4px;background:var(--accent);border-radius:2px;height:6px}
body.playing .brand .eq i{animation:eq .6s ease-in-out infinite alternate}
.brand .eq i:nth-child(2){animation-delay:.15s;background:var(--blue)}.brand .eq i:nth-child(3){animation-delay:.3s;background:var(--gold)}
@keyframes eq{from{height:4px}to{height:18px}}
.stat{display:flex;align-items:center;gap:4px;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.stat svg{width:20px;height:20px}
main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--accent)}
/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button,.quick a{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink)}
.quick b{font-family:var(--f-display);font-size:16px}
.quick small{color:var(--muted);font-size:12px}
/* song list */
.songs{display:flex;flex-direction:column;gap:12px}
.song{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:left;box-shadow:var(--shadow);width:100%}
.song .mini{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,var(--c) 0 22%,var(--disc) 23% 100%);position:relative}
.song .mini::after{content:"";position:absolute;inset:44%;border-radius:50%;background:var(--surface)}
.song .t{min-width:0}
.song .t b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.2}
.song .t small{color:var(--muted);font-size:12px}
.stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.sect{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
/* song detail / player */
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px}
.vinyl{width:min(56vw,210px);aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle,var(--disc) 0 2px,color-mix(in srgb,var(--disc) 85%,#fff) 3px 4px);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.vinyl .lab{position:absolute;inset:32%;border-radius:50%;background:var(--c);display:grid;place-items:center;text-align:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:12px;line-height:1.1;padding:6px}
.vinyl .lab::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bg)}
body.playing .vinyl{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lyrics{display:flex;flex-direction:column;gap:6px}
.ln{border-radius:14px;padding:10px 12px;transition:background .2s,transform .2s;border:2px solid transparent}
.ln .en{font-size:17px;font-weight:500}
.ln .pt{font-size:13px;color:var(--muted)}
.ln.cur{background:var(--surface);border-color:var(--accent);transform:scale(1.02)}
.ln.done .en{color:var(--muted)}
.w{border-radius:6px;padding:0 1px;cursor:pointer}
.w.key{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.w.now{background:var(--accent);color:var(--accent-ink)}
.vocab{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-size:13px;text-align:left}
.chip b{font-weight:600}
/* lesson */
.lessonbar{display:flex;align-items:center;gap:12px}
.lessonbar .x{background:none;border:0;padding:4px;color:var(--muted)}
.prog{flex:1;height:14px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.hearts{color:var(--bad);font-weight:700;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.q{display:flex;flex-direction:column;gap:14px}
.q .prompt{font-size:20px;font-weight:500;line-height:1.45}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center;font-weight:600}
.speak{width:64px;height:64px;border-radius:18px;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000);flex:none}
.speak svg{width:30px;height:30px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;font-size:16px;box-shadow:var(--shadow)}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--surface))}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.answer{border-bottom:2px solid var(--line);padding-bottom:10px;min-height:60px}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:16px;box-shadow:var(--shadow)}
.tile.used{visibility:hidden}
.input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;font-size:15px;box-shadow:var(--shadow);min-height:52px}
.mt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--surface))}
.mt.gone{opacity:.25;pointer-events:none;box-shadow:none}
.mt.shake,.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .2s ease-out}
.sheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet.ok{background:var(--good-bg);color:var(--good)}
.sheet.no{background:var(--bad-bg);color:var(--bad)}
.sheet h3{font-size:20px}
.sheet p{margin:0;color:var(--ink)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.end{text-align:center;align-items:center}
.big{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
/* blue english */
.aulas{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.aula{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.aula.on{background:var(--blue);border-color:var(--blue);color:#fff}
.ytwrap{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:var(--disc)}
.ytwrap iframe,.ytwrap #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.aula.cur{outline:3px solid var(--accent);outline-offset:1px}
.bar{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
/* notebook */
.words{display:flex;flex-direction:column;gap:8px}
.word{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-block:8px}
.word b{font-weight:600}
.word small{color:var(--muted)}
.lvl{display:flex;gap:3px}
.lvl i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--good)}
.flash{min-height:200px;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.flash .front{font-family:var(--f-display);font-size:30px;font-weight:700}
.flash .back{font-size:20px;color:var(--muted)}
.timer{font-family:var(--f-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface)}
.badge .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;background:var(--surface2);color:var(--muted)}
.badge.on .ic{background:var(--gold);color:#3A2A00}
.badge small{font-size:11px;line-height:1.25;color:var(--muted)}
.badge b{font-size:12px;line-height:1.2}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-block:10px}
.set:last-child{border:0}
select,input[type=range]{font:inherit;accent-color:var(--accent)}
select{padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:90vw;text-align:center;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}
.pop{position:fixed;z-index:45;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center;max-width:80vw}
.pop button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:4px 8px;font-weight:600;font-size:12px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.tip{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span>Inglês de Bolso</span></div>
    <span class="stat" title="Ofensiva (dias seguidos)" id="tStreak"></span>
    <span class="stat" title="XP total" id="tXp"></span>
    <span class="stat" title="Nível" id="tLvl"></span>
  </header>
  <main id="app"></main>
</div>
<nav class="nav" aria-label="Seções"><div class="in" id="nav"></div></nav>
<canvas id="confetti"></canvas>

<script>
/* ============ DADOS ============ */
const BLUE_URL='https://www.youtube.com/playlist?list=PLwXhg5fc7iVShymSxULvHvpbyQFrLXcDB';
const SONGS=[
 {id:'hello',title:'Hello, Hello!',by:'Original Inglês de Bolso',level:'A1',focus:'Cumprimentos e verbo to be',bpm:100,root:60,c:'#FF6A2B',
  lines:[
   ['Hello, hello, how [are] you?','Olá, olá, como vai você?'],
   ["I'm [fine], thanks, and how about you?",'Estou bem, obrigado, e você?'],
   ["My [name] is Sam, it's nice to [meet] you",'Meu nome é Sam, prazer em te conhecer'],
   ["Where are you [from]? I'm from Brazil",'De onde você é? Sou do Brasil'],
   ['I [live] in São Paulo, come and visit!','Moro em São Paulo, venha visitar!'],
   ['Good [morning], good afternoon','Bom dia, boa tarde'],
   ['Good [night], see you [soon]!','Boa noite, até logo!']],
  vocab:[['how are you','como vai você'],['fine','bem'],['nice to meet you','prazer em conhecer'],['where are you from','de onde você é'],['I live in','eu moro em'],['see you soon','até logo']]},
 {id:'routine',title:'Wake Up!',by:'Original Inglês de Bolso',level:'A1',focus:'Presente simples e rotina',bpm:110,root:62,c:'#3157FF',
  lines:[
   ['Every day I [wake up] at seven','Todo dia eu acordo às sete'],
   ['I [take a shower], then I get dressed','Tomo banho e depois me visto'],
   ['I [have breakfast], coffee and bread','Tomo café da manhã: café e pão'],
   ['I [brush my teeth] and I make my bed','Escovo os dentes e arrumo a cama'],
   ['I [go to work] at half past eight','Vou para o trabalho às oito e meia'],
   ['I [never] want to be late','Nunca quero me atrasar'],
   ['She [works] all day, he [studies] at night','Ela trabalha o dia todo, ele estuda à noite'],
   ['On Sunday we [relax], that is right!','No domingo a gente relaxa, isso mesmo!']],
  vocab:[['wake up','acordar'],['take a shower','tomar banho'],['have breakfast','tomar café da manhã'],['brush my teeth','escovar os dentes'],['go to work','ir trabalhar'],['never','nunca'],['relax','relaxar']]},
 {id:'coffee',title:'Coffee To Go',by:'Original Inglês de Bolso',level:'A2',focus:'Pedir no café e pagar',bpm:104,root:57,c:'#9B5A2E',
  lines:[
   ['Hi there! [Can I get] a coffee, please?','Oi! Pode me ver um café, por favor?'],
   ['What [size]? Small, medium or large?','Qual tamanho? Pequeno, médio ou grande?'],
   ['A large one, [with milk], no sugar','Um grande, com leite, sem açúcar'],
   ['Is it [for here] or to go?','É para tomar aqui ou para viagem?'],
   ["[To go], please, I'm in a [hurry]",'Para viagem, por favor, estou com pressa'],
   ['[How much] is it?','Quanto é?'],
   ["That's five [dollars], have a nice day!",'São cinco dólares, tenha um bom dia!'],
   ['[Keep the change], you too, okay!','Fique com o troco, você também!']],
  vocab:[['can I get','pode me ver / eu quero'],['size','tamanho'],['for here','para consumir aqui'],['to go','para viagem'],['in a hurry','com pressa'],['how much','quanto custa'],['keep the change','fique com o troco']]},
 {id:'airport',title:'At the Airport',by:'Original Inglês de Bolso',level:'A2',focus:'Viagem e phrasal verbs',bpm:116,root:64,c:'#14965A',
  lines:[
   ['I [check in] two hours before','Faço o check-in duas horas antes'],
   ['I show my [passport] at the gate','Mostro meu passaporte no portão'],
   ["Boarding now, [don't be late]!",'Embarque agora, não se atrase!'],
   ['The plane will [take off] at nine','O avião vai decolar às nove'],
   ["[Fasten your seatbelt], everything's fine",'Aperte o cinto, está tudo bem'],
   ['We [land] in Miami in the sun','Pousamos em Miami no sol'],
   ['My friend will [pick me up], what fun!','Meu amigo vai me buscar, que legal!'],
   ['[Where is] the exit? Over there!','Onde fica a saída? Ali!']],
  vocab:[['check in','fazer o check-in'],['passport','passaporte'],['gate','portão de embarque'],['take off','decolar'],['fasten your seatbelt','aperte o cinto'],['land','pousar'],['pick me up','me buscar']]},
 {id:'weekend',title:'Last Weekend',by:'Original Inglês de Bolso',level:'A2',focus:'Passado simples (irregulares)',bpm:108,root:59,c:'#C2378B',
  lines:[
   ['Last weekend I [went] to the beach','No fim de semana passado eu fui à praia'],
   ['I [saw] my friends and we [had] lunch','Vi meus amigos e almoçamos'],
   ['We [ate] some fish, we [drank] some juice','Comemos peixe, bebemos suco'],
   ['I [bought] a hat, I [took] a photo','Comprei um chapéu, tirei uma foto'],
   ['We [danced] all night, oh oh oh oh','Dançamos a noite toda, oh oh oh oh'],

const AC=window.AudioContext||window.webkitAudioContext;let ac=null,master=null,noiseBuf=null;
function ensureAudio(){try{if(!ac&&AC){ac=new AC();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);
 noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 if(ac&&ac.state==='suspended')ac.resume()}catch(e){}}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(freq,t,dur,type='sine',vol=.2,dest){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(dest||master);o.start(t);o.stop(t+dur+.05)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
 g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(beat.bus);o.start(t);o.stop(t+.3)}
function noise(t,dur,hp,vol){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(beat.bus);s.start(t);s.stop(t+dur+.02)}
const beat={timer:null,bus:null,
 start(bpm,root){ensureAudio();if(!ac)return;this.stop();if(!S.beat)return;this.bus=ac.createGain();this.bus.gain.value=.55;this.bus.connect(master);
  this.bpm=bpm;this.root=root;this.step=0;this.next=ac.currentTime+.06;this.timer=setInterval(()=>this.tick(),25)},
 stop(){if(this.timer)clearInterval(this.timer);this.timer=null;if(this.bus){const b=this.bus;try{b.gain.setTargetAtTime(0,ac.currentTime,.05);setTimeout(()=>b.disconnect(),400)}catch(e){}this.bus=null}},
 tick(){const spb=60/this.bpm/2;while(this.next<ac.currentTime+.12){this.play(this.step,this.next,spb);this.next+=spb;this.step=(this.step+1)%32}},
 play(s,t,spb){const k=s%8,bar=Math.floor(s/8),prog=[0,-3,5,7][bar],r=this.root+prog;
  if(k===0||k===4||k===5&&bar===3)kick(t);if(k===2||k===6)noise(t,.14,1500,.22);noise(t,.04,7000,k%2?.05:.09);
  if(k===0||k===3||k===6)tone(mtof(r-24),t,spb*1.4,'triangle',.22,this.bus);
  if(k===0)[0,4,7].forEach(i=>{const third=(prog===-3)?3:4;tone(mtof(r+(i===4?third:i)),t,spb*7,'sine',.035,this.bus)});
  if(k===4)tone(mtof(r+12+(bar%2?7:4)),t,spb*.8,'square',.025,this.bus)}};
function sfx(kind){ensureAudio();if(!ac)return;const t=ac.currentTime;
 if(kind==='ok'){tone(659,t,.12,'triangle',.25);tone(988,t+.09,.22,'triangle',.25)}
 else if(kind==='no'){tone(180,t,.25,'sawtooth',.12);tone(150,t+.12,.3,'sawtooth',.12)}
 else if(kind==='tap'){tone(880,t,.05,'sine',.08)}
 else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.09,.3,'triangle',.22))}}

 let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(fb);onend&&onend()};

let L=null;
function makeQ(type,line,song){
 const pool=[...new Set(song.L.flatMap(l=>l.keys).concat(song.V.map(v=>v.en)))];
 if(type==='listen'||type==='type'){const key=pick(line.keys);const i=line.plain.indexOf(key);
  const before=line.plain.slice(0,i),after=line.plain.slice(i+key.length);
  const seen=new Set([norm(key)]);let ds=shuffle(pool).filter(p=>{const n=norm(p);if(seen.has(n))return false;seen.add(n);return true});if(ds.length<3)ds=ds.concat(shuffle(ALLKEYS).filter(p=>{const n=norm(p);if(seen.has(n))return false;seen.add(n);return true}));
  return {type,line,key,before,after,opts:shuffle([key,...ds.slice(0,3)])}}
 if(type==='order'){const toks=line.plain.split(/\s+/);return {type,line,toks:shuffle(toks.map((t,i)=>({t,i}))),picked:[]}}
 if(type==='translate'){const others=[...new Set(shuffle(song.L.filter(l=>l.pt!==line.pt)).map(l=>l.pt))].slice(0,2);return {type,line,opts:shuffle([line.pt,...others])}}
}
function buildLesson(song){const ls=shuffle(song.L.filter(l=>l.keys.length));const plan=['listen','translate','order','type','listen','order','type'];const qs=[];
 plan.forEach((t,i)=>{const line=ls[i%ls.length];let tt=t;if(tt==='order'&&line.plain.split(/\s+/).length>9)tt='listen';qs.push(makeQ(tt,line,song))});
 qs.splice(3,0,{type:'match',pairs:shuffle(song.V).slice(0,4)});return qs}
VIEWS.lesson=id=>{const s=SONGS.find(x=>x.id===id);L={song:s,qs:buildLesson(s),i:0,hearts:5,miss:0,first:0,total:0,retried:new Set()};L.total=L.qs.length;renderQ()};
function renderQ(){const q=L.qs[L.i];closeSheet();

  <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><button class="speak" data-act="sayline" aria-label="Ouvir de novo">${IC.spk}</button>
  <div class="prompt">${esc(q.before)}<span class="blank" id="blank">${q.type==='type'?'?':'___'}</span>${esc(q.after)}</div></div>
  ${q.type==='listen'?`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-opt="${i}">${esc(o)}</button>`).join('')}</div>`:
   `<input class="input" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Digite em inglês"><p class="tip">Dica: ${q.key.split(' ').length} palavra${q.key.split(' ').length>1?'s':''}, começa com “${esc(q.key[0])}”.</p>`}`}
 else if(q.type==='translate'){body=`<div class="eyebrow">O que significa?</div><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><button class="speak" data-act="sayline" aria-label="Ouvir">${IC.spk}</button><div class="prompt">${esc(q.line.plain)}</div></div>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-opt="${i}">${esc(o)}</button>`).join('')}</div>`}
 else if(q.type==='order'){body=`<div class="eyebrow">Monte a frase que você ouvir</div><div class="row" style="flex-wrap:nowrap"><button class="speak" data-act="sayline" aria-label="Ouvir">${IC.spk}</button><p class="muted" style="margin:0">${S.trans?esc(q.line.pt):'Toque para ouvir a frase'}</p></div>
  <div class="tiles answer" id="ans">${q.picked.map((p,j)=>`<button class="tile" data-unpick="${j}">${esc(q.toks[p].t)}</button>`).join('')}</div>
  <div class="tiles">${q.toks.map((t,j)=>`<button class="tile ${q.picked.includes(j)?'used':''}" data-pick="${j}">${esc(t.t)}</button>`).join('')}</div>`}
 else if(q.type==='match'){q.left=q.left||shuffle(q.pairs.map((p,i)=>i));q.right=q.right||shuffle(q.pairs.map((p,i)=>i));q.gone=q.gone||[];
  body=`<div class="eyebrow">Ligue os pares</div><div class="match"><div class="col">${q.left.map(i=>`<button class="mt ${q.gone.includes(i)?'gone':''} ${q.selL===i?'sel':''}" data-ml="${i}">${esc(q.pairs[i].en)}</button>`).join('')}</div>

 <div class="q">${body}</div>
 ${q.type==='match'?'':`<button class="btn good wide" id="check" data-act="check" ${q.type==='type'||q.type==='order'||q.sel!=null?'':'disabled'}>Verificar</button>`}`;
 if(q.type==='type'){const inp=document.getElementById('typed');inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkQ()}});setTimeout(()=>inp.focus(),50)}

function checkQ(){const q=L.qs[L.i];let ok=false,ans='';
 if(q.type==='listen'){if(q.sel==null)return;ok=norm(q.opts[q.sel])===norm(q.key);ans=q.key}
 else if(q.type==='type'){const v=(document.getElementById('typed')||{}).value||'';if(!v.trim())return;ok=norm(v)===norm(q.key);ans=q.key}
 else if(q.type==='translate'){if(q.sel==null)return;ok=q.opts[q.sel]===q.line.pt;ans=q.line.pt}
 else if(q.type==='order'){if(!q.picked.length)return;ok=norm(q.picked.map(p=>q.toks[p].t).join(' '))===norm(q.line.plain);ans=q.line.plain}

 if(ok){sfx('ok');if(!q.retry)L.first++}else{sfx('no');L.hearts--;L.miss++;if(!q.retry){const c=Object.assign({},q,{retry:1,sel:null,spoken:0});if(c.type==='order')c.picked=[];L.qs.push(c)}}

 S.songs[s.id]=Math.max(S.songs[s.id]||0,stars);S.lessons++;if(L.miss===0&&!S.ach.includes('perfect')){S.ach.push('perfect');toast('Conquista: Sem errar')}

 ${rev.flip?`<div class="grid2"><button class="btn bad" data-rev="0">Esqueci</button><button class="btn good" data-rev="1">Lembrei</button></div>`:`<button class="btn blue wide" data-say="${esc(w.en)}">${IC.spk.replace('<svg','<svg width="22" height="22"')} Ouvir</button>`}`;
 if(!rev.flip)speak(w.en,{rate:.85})}
function rate(ok){const w=rev.list[rev.i];w.box=ok?Math.min(5,w.box+1):0;w.due=addDays(today(),INTERVALS[w.box]);if(ok){rev.ok++;sfx('ok')}else sfx('no');save();rev.i++;rev.flip=false;renderCard()}

/* ---- desafio relâmpago ---- */
let blitzState=null;
VIEWS.blitz=()=>{const src=S.notebook.filter(w=>w.pt).length>=4?S.notebook.filter(w=>w.pt):ALLVOCAB;
 blitzState={src,score:0,left:60,timer:null,q:null};
 app.innerHTML=`<div class="card end"><div class="eyebrow">Desafio relâmpago</div><h1>60 segundos</h1><p class="muted">Escolha a tradução certa o mais rápido que puder. Cada acerto vale 1 XP.</p><button class="btn wide" data-act="blitzgo">Começar</button></div>`};
function blitzStart(){const b=blitzState;b.timer=setInterval(()=>{b.left--;const t=document.getElementById('bt');if(t)t.textContent=b.left;if(b.left<=0){clearInterval(b.timer);b.timer=null;blitzEnd()}},1000);blitzNext()}
function blitzNext(){const b=blitzState;const w=pick(b.src);const ds=shuffle(b.src.filter(x=>x.pt!==w.pt).map(x=>x.pt)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);b.q={w,opts:shuffle([w.pt,...ds])};
 app.innerHTML=`<div class="sect"><span class="timer" id="bt">${b.left}</span><span class="big" style="font-size:30px;color:var(--gold)">${b.score}</span></div>
 <div class="card flash" style="min-height:120px"><span class="front">${esc(w.en)}</span></div>
 <div class="opts">${b.q.opts.map((o,i)=>`<button class="opt" data-bz="${i}">${esc(o)}</button>`).join('')}</div>`}
function blitzEnd(){const b=blitzState;if(b.score)addXp(b.score);sfx('win');if(b.score>=10)confetti();
 app.innerHTML=`<div class="card end"><div class="eyebrow">Tempo esgotado</div><div class="big" style="color:var(--gold)">${b.score}</div><h1>acertos</h1><p class="muted">+${b.score} XP</p>
 <div class="grid2" style="width:100%"><button class="btn ghost" data-go="notebook">Caderno</button><button class="btn" data-go="blitz">De novo</button></div></div>`}

/* ---- perfil ---- */
VIEWS.profile=(confirmReset)=>{const lv=level(S.xp),cur=LEVELS[lv-1]||0,nxt=LEVELS[lv]||cur+600;const done=SONGS.filter(s=>S.songs[s.id]).length;
 app.innerHTML=`<div><div class="eyebrow">Seu progresso</div><h1>Nível ${lv}</h1></div>
 <div class="card"><div class="sect"><span class="muted">${S.xp} XP</span><span class="muted">${nxt} XP para o nível ${lv+1}</span></div><div class="bar"><i style="width:${Math.min(100,(S.xp-cur)/(nxt-cur)*100)}%;background:var(--gold)"></i></div>
 <div class="grid2"><div><div class="eyebrow">Ofensiva</div><b class="big" style="font-size:28px">${S.streak}</b> dias</div><div><div class="eyebrow">Músicas</div><b class="big" style="font-size:28px">${done}</b>/${SONGS.length}</div>
 <div><div class="eyebrow">Palavras</div><b class="big" style="font-size:28px">${S.notebook.length}</b></div><div><div class="eyebrow">Aulas Blue</div><b class="big" style="font-size:28px">${S.aulas.length}</b>/64</div></div></div>
 <div class="card"><h3>Conquistas</h3><div class="badges">${BADGES.map(b=>`<div class="badge ${S.ach.includes(b.id)?'on':''}"><span class="ic">${b.ic}</span><b>${b.t}</b><small>${b.d}</small></div>`).join('')}</div></div>
 <div class="card"><h3>Ajustes</h3>
  <div class="set"><label for="goal">Meta diária</label><select id="goal">${[20,30,50,80].map(g=>`<option value="${g}" ${S.goal===g?'selected':''}>${g} XP</option>`).join('')}</select></div>
  <div class="set"><label for="beatT">Batida no karaokê</label><input type="checkbox" id="beatT" ${S.beat?'checked':''}></div>
  <div class="set"><label for="transT">Mostrar tradução</label><input type="checkbox" id="transT" ${S.trans?'checked':''}></div>
  <div class="set"><label for="rateP">Velocidade da voz</label><input type="range" id="rateP" min="0.6" max="1.15" step="0.05" value="${S.rate}"></div>
  <div class="set"><span>Zerar progresso</span>${confirmReset?`<span class="row"><button class="btn ghost" data-go="profile">Cancelar</button><button class="btn bad" data-act="reset">Zerar tudo</button></span>`:`<button class="btn ghost" data-act="askreset">Zerar</button>`}</div>
 </div>
 <p class="tip">O progresso fica salvo neste aparelho. Ideias de: Duolingo (ofensiva, XP, vidas), LyricsTraining (lacunas na letra), Lirica (vocabulário de cada música), Songlyo (revisão espaçada e desafio rápido).</p>`;
 document.getElementById('goal').onchange=e=>{S.goal=+e.target.value;save()};document.getElementById('beatT').onchange=e=>{S.beat=e.target.checked;save()};
 document.getElementById('transT').onchange=e=>{S.trans=e.target.checked;save()};document.getElementById('rateP').oninput=e=>{S.rate=+e.target.value;save()}};

/* ============ EVENTOS ============ */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-w]');if(!t){closePop();return}
 const d=t.dataset;
 if(d.w!==undefined&&t.classList.contains('w')){wordPop(t);return}
 if(d.save!==undefined){if(saveWord(d.save,d.pt))toast('Salvo no caderno');else toast('Já está no caderno');closePop();return}
 closePop();
 if(d.go){if(view==='lesson'&&L&&d.go!=='songs'){}go(d.go);return}
 if(d.song){go('song',d.song);return}
 if(d.player){go('player',d.player);return}
 if(d.lesson){ensureAudio();go('lesson',d.lesson);return}
 if(d.say){speak(d.say,{rate:.85});return}
 if(d.aula){if(EMBED)playAula(+d.aula);else toggleAula(+d.aula);return}
 if(d.aulatoggle){toggleAula(+d.aulatoggle);return}
 if(d.mark){if(curAula&&!S.aulas.includes(curAula))toggleAula(curAula);return}
 if(d.rev!==undefined){rate(d.rev==='1');return}
 if(d.bz!==undefined){const b=blitzState;if(!b||!b.q||b.left<=0)return;const ok=b.q.opts[+d.bz]===b.q.w.pt;t.classList.add(ok?'ok':'no');if(ok){b.score++;sfx('ok')}else sfx('no');setTimeout(()=>{if(b.left>0)blitzNext()},ok?220:550);return}
 if(view==='lesson'&&L){const q=L.qs[L.i];
  if(d.opt!==undefined&&!sheetEl){q.sel=+d.opt;sfx('tap');document.querySelectorAll('.opt').forEach((o,i)=>o.classList.toggle('sel',i===q.sel));const c=document.getElementById('check');if(c)c.disabled=false;return}
  if(d.pick!==undefined&&!sheetEl){const j=+d.pick;if(!q.picked.includes(j)){q.picked.push(j);sfx('tap');renderQ()}return}
  if(d.unpick!==undefined&&!sheetEl){q.picked.splice(+d.unpick,1);renderQ();return}
  if(d.ml!==undefined){q.selL=+d.ml;sfx('tap');speak(q.pairs[q.selL].en,{rate:.9});renderQ();return}
  if(d.mr!==undefined){if(q.selL==null){t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),400);return}
   const r=+d.mr;if(r===q.selL){q.gone.push(r);q.selL=null;sfx('ok');if(q.gone.length===q.pairs.length){L.first++;renderQ();showSheet(true,'Pares completos!','');}else renderQ()}
   else{sfx('no');t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),400)}return}
 }
 switch(d.act){
  case 'toggle':togglePlay();break;
  case 'trans':S.trans=!S.trans;save();go('player',player.song.id);break;
  case 'sayline':{const q=L.qs[L.i];speak(q.line.plain);break}
  case 'check':checkQ();break;
  case 'next':nextQ();break;
  case 'quit':go('song',L.song.id);break;
  case 'flip':rev.flip=!rev.flip;renderCard();break;
  case 'blitzgo':blitzStart();break;
  case 'askreset':VIEWS.profile(true);break;
  case 'reset':S=fresh();save();toast('Progresso zerado');go('home');break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&sheetEl&&document.activeElement!==sheetEl.querySelector('button')){e.preventDefault();nextQ()}});
window.addEventListener('scroll',closePop,{passive:true});

/* confete */
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=document.getElementById('confetti'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#FF6A2B','#3157FF','#E9A800','#14965A','#C2378B'];const P=[...Array(120)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:pick(cols)}));
 const t0=performance.now();(function f(t){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  if(t-t0<2600)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height)})(t0)}

/* início */
checkDay();save();go('home');
</script>

</body>
</html>
